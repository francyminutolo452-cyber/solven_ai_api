<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solven.</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background-color: #0b0a0f; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* 📂 SIDEBAR */
        .sidebar { width: 280px; background-color: #0d0c13; border-right: 1px solid #191822; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; z-index: 10; transition: transform 0.3s ease; }
        .sidebar-top { display: flex; flex-direction: column; gap: 16px; height: 80%; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 800; }
        .btn-toggle-sidebar { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 18px; }
        .btn-new-chat { width: 100%; background-color: #8b5cf6; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15); }
        .search-box { background-color: #12111a; border: 1px solid #1c1b26; border-radius: 10px; padding: 12px; color: white; font-size: 14px; width: 100%; outline: none; }
        .history-title { font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; margin-bottom: 5px; }
        .history-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .history-item { padding: 10px 8px; border-radius: 8px; font-size: 14px; color: #e5e7eb; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background-color: #12111a; }
        .history-dots { color: #4b5563; font-weight: bold; cursor: pointer; }
        
        .sidebar-footer { border-top: 1px solid #191822; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
        .user-avatar { width: 38px; height: 38px; background-color: #1c1a27; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #8b5cf6; border: 1px solid #2d2a3d; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 14px; font-weight: 600; }
        .user-plan { font-size: 12px; color: #6b7280; }
        .btn-upgrade-side { background: none; border: none; color: #8b5cf6; font-size: 18px; cursor: pointer; }
        .sidebar-icon-gear { color: #6b7280; font-size: 18px; cursor: pointer; margin-left: 8px; }

        /* ⚙️ POPUP UTENTE VERTICALE */
        .user-popup-menu { position: absolute; bottom: 65px; left: 0; width: 250px; background-color: #12111a; border: 1px solid #1c1b26; border-radius: 14px; display: none; flex-direction: column; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 30; }
        .popup-email { padding: 12px; font-size: 13px; color: #6b7280; border-bottom: 1px solid #1c1b26; word-break: break-all; }
        .popup-item { padding: 11px 12px; font-size: 14px; color: #e5e7eb; cursor: pointer; border-radius: 8px; display: flex; align-items: center; gap: 12px; }
        .popup-item:hover { background-color: #1c1a27; }
        .popup-item.logout-btn { color: #ff3b30; border-top: 1px solid #1c1b26; margin-top: 4px; }

        /* AREA CONTENUTO CENTRALE */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #0b0a0f; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; height: 60px; position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
        .top-bar-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .top-bar-title span { background-color: #12111a; border: 1px solid #1c1b26; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: #9ca3af; font-weight: 500; }
        
        /* ☀️ INTERFACCIA BENVENUTO */
        .welcome-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; max-width: 760px; width: 100%; margin: 60px auto 0 auto; padding: 20px; }
        .welcome-container { width: 100%; text-align: left; margin-bottom: 30px; }
        .date-badge { color: #6b7280; font-size: 14px; font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .welcome-title { font-size: 48px; font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: -1px; }
        .welcome-title span { color: #8b5cf6; display: block; }
        .welcome-subtitle { color: #9ca3af; font-size: 16px; margin-top: 15px; }
        
        .suggestions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
        .suggestion-card { background-color: #12111a; border: 1px solid #1c1b26; border-radius: 12px; padding: 20px; cursor: pointer; text-align: left; color: #e5e7eb; font-size: 14px; line-height: 1.4; }
        .suggestion-card:hover { border-color: #2d2a3d; background-color: #15141f; }
        
        .messages-container { flex: 1; width: 100%; max-width: 760px; margin: 60px auto 0 auto; padding: 20px; overflow-y: auto; display: none; flex-direction: column; gap: 20px; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 16px; font-size: 15px; line-height: 1.45; }
        .msg.user { background-color: #8b5cf6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.bot { background-color: #12111a; border: 1px solid #1c1b26; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }

        /* 📥 BARRA DI SCRITTURA IN BASSO */
        .input-container { width: 100%; max-width: 760px; margin: 0 auto; padding: 15px 20px; }
        .input-box { background-color: #12111a; border: 1px solid #1c1b26; border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
        .input-box textarea { width: 100%; background: none; border: none; color: white; font-size: 15px; outline: none; resize: none; height: 24px; }
        .input-actions { display: flex; justify-content: space-between; align-items: center; }
        .actions-left { display: flex; gap: 18px; color: #9ca3af; font-size: 18px; align-items: center; }
        .actions-right { display: flex; align-items: center; gap: 14px; }
        .model-trigger-btn { background: none; border: none; color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .btn-send { background-color: #1c1a27; color: #4b5563; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-send.active { background-color: #8b5cf6; color: white; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); }
        .input-footer-text { text-align: center; color: #4b5563; font-size: 11px; margin-top: 8px; }

        /* 💎 OVERLAY VERSIONI IA */
        .models-overlay-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; background-color: #0d0c13; border-left: 1px solid #191822; z-index: 100; display: none; flex-direction: column; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .panel-close-btn { cursor: pointer; font-size: 18px; color: #9ca3af; }
        .models-list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .model-card-item { background-color: #12111a; border: 1px solid #1c1b26; border-radius: 14px; padding: 16px; cursor: pointer; }
        .model-card-item.selected { border-color: #8b5cf6; background-color: #151322; }
        .model-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .model-badge-status { font-size: 11px; padding: 2px 6px; border-radius: 6px; font-weight: 600; }
        .badge-lite { background-color: #1f2937; color: #9ca3af; }
        .badge-base { background-color: #1e1b4b; color: #818cf8; }
        .model-card-desc { font-size: 13px; color: #9ca3af; line-height: 1.4; margin-bottom: 8px; }
        .model-card-lock-text { color: #8b5cf6; font-size: 12px; font-weight: 600; }
        .btn-upgrade-panel-bottom { background-color: #8b5cf6; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; margin-top: 15px; }

        /* ⚙️ PANNELLO IMPOSTAZIONI COMPLETO CON ABBONAMENTI */
        .settings-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.7); z-index: 150; display: none; justify-content: center; align-items: flex-start; padding-top: 50px; }
        .settings-modal-content { background-color: #0d0c13; border: 1px solid #191822; border-radius: 16px; width: 100%; max-width: 900px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
        .chip { background-color: #12111a; border: 1px solid #1c1b26; padding: 10px 14px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 13px; color: #e5e7eb; transition: all 0.2s; }
