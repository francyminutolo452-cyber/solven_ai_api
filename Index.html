<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solven. - Accedi</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background-color: #0b0a0f; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container-box { width: 100%; max-width: 420px; padding: 10px; }
        
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 35px; color: #ffffff; letter-spacing: -0.5px; }
        .logo span { color: #8b5cf6; }
        
        h1 { font-size: 32px; font-weight: 700; margin: 0 0 10px 0; letter-spacing: -0.5px; }
        .subtitle { color: #9ca3af; font-size: 15px; margin-bottom: 35px; line-height: 1.4; }
        
        /* CONTENITORE TABS */
        .tabs-container { display: flex; background-color: #12111a; padding: 4px; border-radius: 14px; margin-bottom: 30px; border: 1px solid #1c1b26; }
        .tab { flex: 1; text-align: center; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: #9ca3af; transition: all 0.2s; }
        .tab.active { background-color: #1c1a27; color: #ffffff; border: 1px solid #2d2a3d; }
        
        /* FORM E INPUT CORRETTI */
        .form-group { margin-bottom: 22px; }
        .form-group.hidden { display: none; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #e5e7eb; }
        input { width: 100%; background-color: #12111a; border: 1px solid #1c1b26; border-radius: 12px; padding: 16px; color: white; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #8b5cf6; }
        input::placeholder { color: #4b5563; }
        
        /* PULSANTE INVIATORE VIOLA CANCELLATO */
        .btn-submit { width: 100%; background-color: #8b5cf6; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2); }
        .btn-submit:hover { background-color: #7c3aed; }
        
        .error-msg { color: #ff3b30; font-size: 14px; margin-bottom: 15px; display: none; }
    </style>

    <!-- Collegamento Firebase per autenticazione e passaggi successivi -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://gstatic.com";

        // CONFIGURAZIONE DATI BACKEND
        const firebaseConfig = {
            apiKey: "IL_TUO_API_KEY",
            authDomain: "IL_TUO_AUTH_DOMAIN",
            projectId: "IL_TUO_PROJECT_ID",
            storageBucket: "IL_TUO_STORAGE_BUCKET",
            messagingSenderId: "IL_TUO_MESSAGING_SENDER_ID",
            appId: "IL_TUO_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.gestisciAccessoOndemand = async function(e) {
            e.preventDefault();
            const email = document.getElementById('emailField').value;
            const password = document.getElementById('passwordField').value;
            const nomeInput = document.getElementById('nameField').value.trim();
            const errorDiv = document.getElementById('authErrorText');
            errorDiv.style.display = 'none';

            try {
                if (window.statoCorrenteTab === 'accedi') {
                    await signInWithEmailAndPassword(auth, email, password);
                    localStorage.setItem('solven_user_email', email);
                    window.location.href = 'chat.html';
                } else {
                    if (!nomeInput) { alert("Inserisci il tuo nome per registrarti!"); return; }
                    await createUserWithEmailAndPassword(auth, email, password);
                    localStorage.setItem('solven_user_name', nomeInput);
                    localStorage.setItem('solven_user_email', email);
                    localStorage.setItem('solven_logged_in', 'true');
                    window.location.href = 'chat.html';
                }
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Verifica le credenziali immesse o la robustezza della password.";
            }
        }
    </script>
</head>
<body>

    <div class="container-box">
        <!-- Logo con punto viola -->
        <div class="logo">Solven<span>.</span></div>
        
        <!-- Intestazioni testuali fedeli alla prima foto -->
        <h1 id="mainTitleText">Accedi</h1>
        <div class="subtitle" id="mainSubTitleText">Accedi per riprendere le tue conversazioni.</div>
        
        <!-- Pulsanti di switch a scheda identici alla foto -->
        <div class="tabs-container">
            <div class="tab active" id="btnTabAccedi" onclick="cambiaStrutturaTab('accedi')">Accedi</div>
            <div class="tab" id="btnTabRegistrati" onclick="cambiaStrutturaTab('registrati')">Registrati</div>
        </div>

        <div class="error-msg" id="authErrorText"></div>

        <form onsubmit="gestisciAccessoOndemand(event)">
            <!-- Campo Nome: appare dinamicamente solo durante la Registrazione -->
            <div class="form-group hidden" id="groupNameField">
                <label>Nome</label>
                <input type="text" id="nameField" placeholder="Come ti chiami?">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailField" placeholder="nome@esempio.it" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordField" placeholder="Almeno 6 caratteri" required>
            </div>
            
            <button type="submit" class="btn-submit" id="submitActionBtn">Accedi</button>
        </form>
    </div>

    <script>
        window.statoCorrenteTab = 'accedi';

        function cambiaStrutturaTab(tipo) {
            window.statoCorrenteTab = tipo;
            const tabA = document.getElementById('btnTabAccedi');
            const tabR = document.getElementById('btnTabRegistrati');
            const t頭 = document.getElementById('mainTitleText');
            const s頭 = document.getElementById('mainSubTitleText');
            const gNome = document.getElementById('groupNameField');
            const btn = document.getElementById('submitActionBtn');
            document.getElementById('authErrorText').style.display = 'none';

            if (tipo === 'accedi') {
                tabA.classList.add('active');
                tabR.classList.remove('active');
                t頭.innerText = 'Accedi';
                s頭.innerText = 'Accedi per riprendere le tue conversazioni.';
                gNome.classList.add('hidden');
                btn.innerText = 'Accedi';
            } else {
                tabR.classList.add('active');
                tabA.classList.remove('active');
                t頭.innerText = 'Crea il tuo account';
                s頭.innerText = "Pochi secondi e la tua AI sarà su misura per te.";
                gNome.classList.remove('hidden');
                btn.innerText = 'Registrati';
            }
        }
    </script>
</body>
</html>
