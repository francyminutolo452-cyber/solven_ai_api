<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solven. - Accedi</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background-color: #0d0c12; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-box { width: 100%; max-width: 440px; padding: 20px; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 40px; display: flex; align-items: center; }
        .logo span { color: #8b5cf6; }
        h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px 0; }
        .subtitle { color: #9ca3af; font-size: 15px; margin-bottom: 30px; }
        .tabs { display: flex; background-color: #161520; padding: 4px; border-radius: 12px; margin-bottom: 30px; }
        .tab { flex: 1; text-align: center; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: #9ca3af; }
        .tab.active { background-color: #211f30; color: #ffffff; border: 1px solid #2d2b42; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #e5e7eb; }
        input { width: 100%; background-color: #161520; border: 1px solid #232235; border-radius: 12px; padding: 16px; color: white; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #8b5cf6; }
        input::placeholder { color: #4b5563; }
        .btn-primary { width: 100%; background-color: #8b5cf6; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background-color: #7c3aed; }
        .divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: #4b5563; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1c1b2c; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .btn-google { width: 100%; background-color: #161520; border: 1px solid #232235; color: white; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">Solven<span>.</span></div>
        <h1 id="title">Bentornato</h1>
        <div class="subtitle" id="subtitle">Accedi per riprendere le tue conversazioni.</div>
        
        <div class="tabs">
            <div class="tab active" id="tabAccedi" onclick="switchTab('accedi')">Accedi</div>
            <div class="tab" id="tabRegistrati" onclick="switchTab('registrati')">Registrati</div>
        </div>

        <form onsubmit="gestisciLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="nome@esempio.it" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Almeno 6 caratteri" required>
            </div>
            <button type="submit" class="btn-primary">Accedi</button>
        </form>

        <div class="divider">OPPURE</div>

        <button class="btn-google">
            <img src="https://gstatic.com" alt="Google" width="18">
            Continua con Google
        </button>
    </div>

    <script>
        function switchTab(tipo) {
            const tAccedi = document.getElementById('tabAccedi');
            const tReg = document.getElementById('tabRegistrati');
            const title = document.getElementById('title');
            const sub = document.getElementById('subtitle');
            const btn = document.querySelector('.btn-primary');

            if(tipo === 'accedi') {
                tAccedi.classList.add('active');
                tReg.classList.remove('active');
                title.innerText = 'Bentornato';
                sub.innerText = 'Accedi per riprendere le tue conversazioni.';
                btn.innerText = 'Accedi';
            } else {
                tReg.classList.add('active');
                tAccedi.classList.remove('active');
                title.innerText = 'Crea un account';
                sub.innerText = 'Registrati per iniziare a usare Solven.';
                btn.innerText = 'Registrati';
            }
        }

        function gestisciLogin(e) {
            e.preventDefault();
            // Salta temporaneamente il server di controllo per farti entrare subito nell'app
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
